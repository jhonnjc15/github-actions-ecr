name: Deploy (build -> infra)

on:
  push:
    paths:
      - "lambda/**"
      - "infra/**"
      - "config/**/*.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      # Detecta qué cambió
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build:
              - 'lambda/**'
              - 'config/**/*.json'
              - 'scripts/**'
              - 'infra/**'
            infra:
              - 'infra/**'
              - '.github/workflows/deploy.yml'

  build_and_push:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Parse scraper config
        id: config
        run: |
          python scripts/parse_config.py config/scraper.json >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          ECR_REPO="${{ steps.config.outputs.ecr_repo }}"
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}
        with:
          context: ./lambda
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:latest

  terraform_apply:
    runs-on: ubuntu-latest
    needs: changes
    # Se ejecuta si cambió infra. Si también hubo build, espera; si no hubo build, igual corre.
    if: ${{ needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse scraper config
        id: config
        run: |
          python scripts/parse_config.py config/scraper.json >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Si tu Terraform usa latest al crear Lambda, valida que exista para evitar el error
      - name: Ensure image :latest exists
        run: |
          aws ecr describe-images \
            --repository-name "${{ steps.config.outputs.ecr_repo }}" \
            --image-ids imageTag=latest >/dev/null

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="ecr_repo=${{ steps.config.outputs.ecr_repo }}" \
            -var="lambda_name=${{ steps.config.outputs.lambda_name }}" \
            -var="state_machine_name=${{ steps.config.outputs.state_machine_name }}" \
            -var="schedule_name=${{ steps.config.outputs.schedule_name }}" \
            -var="schedule_expression=${{ steps.config.outputs.schedule_expression }}" \
            -var="image_tag=latest"
