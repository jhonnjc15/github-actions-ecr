name: Deploy (build -> infra)

on:
  push:
    paths:
      - "lambda/**"
      - "infra/**"
      - "config/**/*.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      # Detecta qué cambió
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build:
              - 'lambda/**'
              - 'config/**/*.json'
              - 'scripts/**'
            infra:
              - 'infra/**'
              - '.github/workflows/deploy.yml'

  build_and_push:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select scraper config
        id: select_config
        run: |
          CHANGED_CONFIG=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'config/*.json' | head -n 1)
          if [ -n "$CHANGED_CONFIG" ]; then
            CONFIG_FILE="$CHANGED_CONFIG"
          else
            CONFIG_FILE=$(git log -1 --name-only --pretty="" -- 'config/*.json' | head -n 1)
          fi
          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: No config JSON found in config/." >&2
            exit 1
          fi
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: Parse scraper config
        id: config
        run: |
          python scripts/parse_config.py "${{ steps.select_config.outputs.config_file }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Ensure ECR repository exists
        run: |
          ECR_REPO="${{ steps.config.outputs.repository }}"
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.repository }}
        with:
          context: ./lambda
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:latest
            ${{ env.IMAGE_URI }}:${{ steps.config.outputs.version }}

  terraform_apply:
    runs-on: ubuntu-latest
    needs: [changes, build_and_push]
    # Se ejecuta si cambió infra. Si también hubo build, espera; si no hubo build, igual corre.
    if: ${{ needs.changes.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select scraper config
        id: select_config
        run: |
          CHANGED_CONFIG=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'config/*.json' | head -n 1)
          if [ -n "$CHANGED_CONFIG" ]; then
            CONFIG_FILE="$CHANGED_CONFIG"
          else
            CONFIG_FILE=$(git log -1 --name-only --pretty="" -- 'config/*.json' | head -n 1)
          fi
          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: No config JSON found in config/." >&2
            exit 1
          fi
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: Parse scraper config
        id: config
        run: |
          python scripts/parse_config.py "${{ steps.select_config.outputs.config_file }}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.region }}

      # Si tu Terraform usa latest al crear Lambda, valida que exista para evitar el error
      - name: Ensure image version exists
        run: |
          aws ecr describe-images \
            --repository-name "${{ steps.config.outputs.repository }}" \
            --image-ids imageTag=${{ steps.config.outputs.version }} >/dev/null

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ steps.config.outputs.region }}" \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="ecr_repo=${{ steps.config.outputs.repository }}" \
            -var="lambda_name=${{ steps.config.outputs.lambda_name }}" \
            -var="state_machine_name=${{ steps.config.outputs.state_machine_name }}" \
            -var="schedule_name=${{ steps.config.outputs.schedule_name }}" \
            -var="schedule_expression=${{ steps.config.outputs.schedule_expression }}" \
            -var="execution_mode=${{ steps.config.outputs.execution_mode }}" \
            -var="lambda_exec_role_arn=${{ secrets.DEV_LAMBDA_EXEC_ROLE_ARN }}" \
            -var="sfn_role_arn=${{ secrets.DEV_SFN_ROLE_ARN }}" \
            -var="scheduler_role_arn=${{ secrets.DEV_SCHEDULER_ROLE_ARN }}" \
            -var="image_tag=${{ steps.config.outputs.version }}"

  run_step_function:
    runs-on: ubuntu-latest
    needs: [build_and_push, terraform_apply]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select scraper config
        id: select_config
        run: |
          CHANGED_CONFIG=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'config/*.json' | head -n 1)
          if [ -n "$CHANGED_CONFIG" ]; then
            CONFIG_FILE="$CHANGED_CONFIG"
          else
            CONFIG_FILE=$(git log -1 --name-only --pretty="" -- 'config/*.json' | head -n 1)
          fi
          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: No config JSON found in config/." >&2
            exit 1
          fi
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: Parse scraper config
        id: config
        run: |
          python scripts/parse_config.py "${{ steps.select_config.outputs.config_file }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Trigger Step Function execution
        run: |
          if [ "${{ steps.config.outputs.execution_mode }}" != "ejecutar_ahora" ]; then
            echo "Execution mode is scheduled; skipping manual execution."
            exit 0
          fi
          SM_ARN=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='${{ steps.config.outputs.state_machine_name }}'].stateMachineArn | [0]" \
            --output text)
          if [ -z "$SM_ARN" ] || [ "$SM_ARN" = "None" ]; then
            echo "ERROR: State machine not found: ${{ steps.config.outputs.state_machine_name }}" >&2
            exit 1
          fi
          aws stepfunctions start-execution --state-machine-arn "$SM_ARN" --input '{"source":"github-actions"}'
