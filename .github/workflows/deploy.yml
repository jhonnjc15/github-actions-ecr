name: Build and Push Image to ECR (from JSON)

on:
  push:
    branches: [dev, qa]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Pick JSON config changed in this push (generic)
      # -------------------------------------------------
      - name: Pick config JSON (use changed in this push; else last changed in repo)
        id: pick_config
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # 1) Si ESTE push tocó algún config/*.json, toma el más recientemente tocado en el rango
          FILE=$(git log -n 1 --name-only --pretty=format: "$BEFORE..$HEAD" -- config \
            | awk '/^config\/.*\.json$/ {print; exit}')

          # 2) Si este push NO tocó config, toma el último config tocado en la historia
          if [ -z "${FILE:-}" ]; then
            FILE=$(git log -n 1 --name-only --pretty=format: -- config \
              | awk '/^config\/.*\.json$/ {print; exit}')
          fi

          if [ -z "${FILE:-}" ]; then
            echo "No JSON config found under config/." >&2
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using config: $FILE"

      # -------------------------------------------------
      # Parse selected JSON
      # -------------------------------------------------
      - name: Parse config (Python)
        id: config
        run: |
          python scripts/parse_json.py "${{ steps.pick_config.outputs.file }}" >> "$GITHUB_OUTPUT"

      - name: Show parsed values
        run: |
          echo "id: ${{ steps.config.outputs.id }}"
          echo "name: ${{ steps.config.outputs.name }}"
          echo "description: ${{ steps.config.outputs.description }}"
          echo "repository: ${{ steps.config.outputs.repository }}"
          echo "version: ${{ steps.config.outputs.version }}"

      # -------------------------------------------------
      # Detect if lambda/ changed
      # -------------------------------------------------
      - name: Detect changes in lambda/
        id: lambda_changes
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^lambda/'; then
            echo "lambda_changed=true" >> "$GITHUB_OUTPUT"
            echo "Lambda folder changed."
          else
            echo "lambda_changed=false" >> "$GITHUB_OUTPUT"
            echo "Lambda folder NOT changed."
          fi

      - name: Ensure ECR repository exists and tag it
        shell: bash
        run: |
          set -e

          ECR_REPO="${{ steps.config.outputs.repository }}"

          if ! aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1; then
            echo "Creating ECR repository with tags: $ECR_REPO"

            aws ecr create-repository \
              --repository-name "$ECR_REPO" \
              --image-scanning-configuration scanOnPush=true \
              --tags \
                Key=DOMINIO,Value=GSFER_RDV_APP \
                Key=PRIORITARIO,Value=NO \
                Key=CAPA,Value=RDV \
                Key=ORIGEN,Value=POULTRY \
                Key=github_repo,Value="${{ github.repository }}" \
                Key=environment,Value="${{ github.ref_name }}"
          else
            echo "ECR repository already exists"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------
      # Only check image existence if lambda did NOT change
      # -------------------------------------------------
      - name: Check if image version already exists
        id: check_image
        if: steps.lambda_changes.outputs.lambda_changed == 'false'
        shell: bash
        run: |
          REPO="${{ steps.config.outputs.repository }}"
          VERSION="${{ steps.config.outputs.version }}"

          echo "Checking if image exists: $REPO:$VERSION"

          if aws ecr describe-images \
              --repository-name "$REPO" \
              --image-ids imageTag="$VERSION" \
              >/dev/null 2>&1; then
            echo "Image already exists: $REPO:$VERSION"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image does not exist."
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image already exists — finishing
        if: steps.lambda_changes.outputs.lambda_changed == 'false' && steps.check_image.outputs.image_exists == 'true'
        run: |
          echo "La imagen ya existe en ECR y lambda no cambió. Finalizando build."
          echo "Repo: ${{ steps.config.outputs.repository }}"
          echo "Version: ${{ steps.config.outputs.version }}"

      - name: Build and push image (Lambda-compatible)
        if: steps.lambda_changes.outputs.lambda_changed == 'true' || steps.check_image.outputs.image_exists == 'false'
        uses: docker/build-push-action@v6
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ steps.config.outputs.repository }}
        with:
          context: ./lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:${{ github.ref_name }}
            ${{ env.IMAGE_URI }}:${{ steps.config.outputs.version }}

      - name: Output published image
        if: steps.lambda_changes.outputs.lambda_changed == 'true' || steps.check_image.outputs.image_exists == 'false'
        shell: bash
        run: |
          echo "Pushed:"
          echo "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ steps.config.outputs.repository }}:${{ steps.config.outputs.version }}"
          echo "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ steps.config.outputs.repository }}:${{ github.sha }}"
          echo "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ steps.config.outputs.repository }}:${{ github.ref_name }}"

      # -------------------------
      # Terraform (infra) - MULTI STACK
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (S3 backend per stack)
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=backend-ga" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=state/${{ github.repository }}/terraform.tfstate"

      - name: Terraform apply (Lambda + SFN +  Scheduler)
        working-directory: infra 
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.ref_name }}" \
            -var="stack_id=${{ steps.config.outputs.id }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="ecr_repo=${{ steps.config.outputs.repository }}" \
            -var="image_tag=${{ steps.config.outputs.version }}" \
            -var="lambda_name=${{ steps.config.outputs.lambda_name }}" \
            -var="state_machine_name=${{ steps.config.outputs.state_machine_name }}" \
            -var="schedule_name=${{ steps.config.outputs.schedule_name }}" \
            -var="schedule_enabled=${{ steps.config.outputs.schedule_enabled }}" \
            -var="schedule_expression=${{ steps.config.outputs.schedule_expression }}" \
            -var="schedule_timezone=${{ steps.config.outputs.schedule_timezone }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="lambda_role_name=${{ secrets.LAMBDA_ROLE_NAME }}" \
            -var="step_function_role_name=${{ secrets.STEP_FUNCTION_ROLE_NAME }}" \
            -var="eventbridge_role_name=${{ secrets.EVENTBRIDGE_ROLE_NAME }}"
      
      - name: Read Terraform  outputs
        if: steps.config.outputs.run_after_deploy == 'true'
        working-directory: infra
        run: |
          echo "STATE_MACHINE_ARN=$(terraform output -raw state_machine_arn)" >> $GITHUB_ENV

      - name: Run after deploy
        if: steps.config.outputs.run_after_deploy == 'true'
        run: |
          aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "postdeploy-${{ steps.config.outputs.id }}-${{ github.run_id }}" \
            --input "{\"source\":\"post_deploy\",\"env\":\"${{ github.ref_name }}\",\"github_repository\":\"${{ github.repository }}\",\"image_tag\":\"${{ steps.config.outputs.version }}\"}"